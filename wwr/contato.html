<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="description"
      content="Entre em contato com a equipe de Rafting. Tire suas dúvidas, envie suas sugestões ou faça sua reserva.">
    <meta name="author" content="Rafael Schmaiske de Morais">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/rafting.css">
    <title>Rafting River - Fale Conosco</title>
</head>

<body>
    <header>
        <img src="imagens/logo.png" alt="Logo Rafting River">
        <nav>
            <ul class="navegacao">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>


    <main class="contato-main">
        <section class="empresa-topo">
            <h1>Rafting River</h1>
            <p>123 Av. das Corredeiras - Vale da Agua</p>
            <p>(11) 99999-8888 / (11) 3333-2222</p>
            <p>contato@raftingriver.com</p>
        </section>

        <div class="mapa-form-container">
            <section class="mapa-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.1975765723!2d-46.6586071!3d-23.561414!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjPCsDMzJzQxLjEiUyA0NsKwMzknMzEuMCJX!5e0!3m2!1wpt-BR!2sbr!4v1600000000000!5m2!1wpt-BR!2sbr"
                  width="100%" height="100%" allowfullscreen="" loading="lazy">
                </iframe>
            </section>

            <section class="contato-form-section">
                <form action="#" method="post" class="contato-form">

                    <div class="form-item row-item">
                        <label for="nomecompleto">Nome</label>
                        <input type="text" id="nomecompleto" name="nomecompleto"
                          placeholder="Digite aqui" required>
                    </div>
                    <div class="form-item row-item">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite aqui"
                          required>
                    </div>
                    <div class="form-item row-item">
                        <label>Propósito da Mensagem</label>
                        <div class="radio-group">
                            <label><input type="radio" name="purpose" value="geral" checked> Dúvida
                                Geral</label>
                            <label><input type="radio" name="purpose" value="reserva">Pergunta sobre
                                reserva</label>

                            <label><input type="radio" name="purpose"
                                  value="sugestao">Sugestão</label>

                        </div>
                    </div>
                    <div class="form-item row-item">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Digite aqui"
                          required></textarea>
                    </div>
                    <div class="form-item checkbox-item">
                        <label>
                            <input type="checkbox" name="noticias" value="subscribe">
                            Por favor, me inscreva nas notícias mensais
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Entrar em Contato!</button>
                </form>
            </section>
        </div>


        <section class="equipe-box">
            <h2>Estamos aqui para Ajudá-lo</h2>
            <div class="employee-grid">
                <figure>
                    <img src="imagens/employee1.jpg" alt="Foto de João Santos">
                    <figcaption>João Santos - Guia Principal</figcaption>
                </figure>
                <figure>
                    <img src="imagens/employee2.jpg" alt="Foto de Jéssica Dias">
                    <figcaption>Jéssica Dias - Gerente de Operações</figcaption>
                </figure>
                <figure>
                    <img src="imagens/employee3.jpg" alt="Adriana Gomes">
                    <figcaption>Adriana Gomes - Atendimento ao Cliente</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rafting River - Rafael Schmaiske de Morais</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="imagens/facebook.svg" alt="Facebook"></a>
            <a href="https://linkedin.com"><img src="imagens/linkedin.svg" alt="LinkedIn"></a>
            <a href="https://instagram.com"><img src="imagens/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
